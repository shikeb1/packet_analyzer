<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DPI Engine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Deep Packet Inspector</h1>

<h2>Upload PCAP</h2>
<input type="file" id="pcapFile" accept=".pcap">

<h3>Blocking Rules</h3>

<input type="text" id="ruleIP" placeholder="IP address">
<button onclick="addRule('ip')">Block IP</button>

<input type="text" id="ruleApp" placeholder="App name">
<button onclick="addRule('app')">Block App</button>

<input type="text" id="ruleDomain" placeholder="Domain">
<button onclick="addRule('domain')">Block Domain</button>

<br><br>
<button onclick="analyze()">Analyze</button>

<hr>
<div id="results"></div>

<script src="/static/script.js"></script>

</body>
</html>
